[package]
name = "kicli"
description = "Eyes and hands in KiCad 10 projects for LLM agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "kicli"
path = "src/lib.rs"

[[bin]]
name = "kicli"
path = "src/main.rs"

# The dependency budget is small on purpose: this tool must build from source
# trivially for years. Every addition needs a licence on the deny.toml
# allowlist and a reason in the commit message.
[dependencies]
kicli-sexpr = { path = "../kicli-sexpr", version = "0.0.0" }
# Project files are JSON. serde_json is also what the JSON output form will use.
# preserve_order keeps object keys in file order, which is what makes a
# round-trip comparison meaningful.
serde_json = { version = "1", features = ["preserve_order"] }
# kicli.toml. Hand-parsing TOML would be a bug farm: the file has quoted table
# names for per-rule settings, and unknown keys must be reported precisely.
toml = "1"
# The command surface. kubectl-style noun-verb with stable help and exit codes
# is what clap is for, and hand-rolling it for thirty verbs is not a good use of
# the dependency budget.
clap = { version = "4", features = ["derive"] }
# Snapshot hashes. SHA-256 truncated to 16 hex characters, per the spec.
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
# The probe harness: drawing builders and oracle readers the tests measure
# with. A dev-dependency reaches no shipped artefact, so the licence allowlist
# does not govern it; the advisory database still does. The edge from kicli-probe
# back to kicli is what lets the builder own the measurement helpers, and cargo
# resolves the dev-only cycle.
kicli-probe = { path = "../kicli-probe", version = "0.0.0" }

[features]
# Tests that read KiCad's GPL demo files from target/.
corpus = []
