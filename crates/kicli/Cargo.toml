[package]
name = "kicli"
description = "Eyes and hands in KiCad 10 projects for LLM agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "kicli"
path = "src/lib.rs"

[[bin]]
name = "kicli"
path = "src/main.rs"

# The dependency budget is small on purpose: this tool must build from source
# trivially for years. Every addition needs a licence on the deny.toml
# allowlist and a reason in the commit message.
[dependencies]
kicli-sexpr = { path = "../kicli-sexpr", version = "0.0.0" }
# Project files are JSON. serde_json is also what the JSON output form will use.
# preserve_order keeps object keys in file order, which is what makes a
# round-trip comparison meaningful.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"

[dev-dependencies]

[features]
# Tests that read KiCad's GPL demo files from target/.
corpus = []
