[package]
name = "kicli-probe"
description = "The instruments kicli's measurement probes are built from."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "kicli_probe"
path = "src/lib.rs"

# This crate is a test instrument. It is a dev-dependency of `kicli` and of
# nothing else, so it reaches no shipped artefact. The licence allowlist does
# not govern a dev-dependency; the advisory database still does.
[dependencies]
# The probe measures what kicli reads, so it holds kicli's model and its
# s-expression layer. The edge back from kicli is a dev-dependency, which is
# what keeps this crate out of the shipped artefact.
kicli = { path = "../kicli", version = "0.0.0" }
kicli-sexpr = { path = "../kicli-sexpr", version = "0.0.0" }
