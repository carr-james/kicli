[package]
name = "kicli-sexpr"
description = "Token-preserving s-expression tree and KiCad's pretty-printer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# This crate keeps minimal dependencies. It depends on nothing of ours. thiserror
# is the project's standard way to declare typed errors.
[dependencies]
thiserror = "2"

[features]
# Tests that read KiCad's GPL demo files from target/. Off by default, so the
# normal test run needs no network and no KiCad install.
corpus = []

[dev-dependencies]
# Property tests are the load-bearing test layer for this crate.
proptest = "1"
